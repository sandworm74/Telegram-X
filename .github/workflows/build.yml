name: Build Telegram X

on:
  push:
    branches: [my-left]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch LFS files
        run: |
          git lfs install
          cd tdlib
          git lfs fetch
          git lfs checkout

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build meson yasm nasm autoconf automake libtool pkg-config gperf ccache

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          app.id=${{ secrets.APP_ID }}
          app.name=${{ secrets.APP_NAME }}
          app.download_url=https://telegram.org/dlx
          telegram.api_id=${{ secrets.TG_API_ID }}
          telegram.api_hash=${{ secrets.TG_API_HASH }}
          tgx.extension=none
          EOF

      - name: Setup (SDK, NDK, native libs)
        run: |
          export TERM=xterm
          chmod +x scripts/setup.sh gradlew
          scripts/setup.sh

      - name: Build APK
        run: ./gradlew assembleLatestUniversalDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-x-apk
          path: app/build/outputs/apk/**/*.apk
